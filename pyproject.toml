[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "slides-diff"
version = "0.1.0"
description = "Diff two PDF slide decks: align slides, show changes side by side"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
slides-diff = "slides_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
